name: Generate lockfile

# Keeps package-lock.json (app) and functions/package-lock.json in sync with package.json, using
# only the official npm registry, commits the result to the branch, then starts the CI and
# secret-scan workflows on that commit (CI always uses `npm ci`). Refuses to run on `main`.
#
# `npm install --package-lock-only` creates a missing lockfile, or updates an existing one with the
# smallest change that matches package.json (existing resolutions are kept). Nothing is committed
# when the lockfiles are already in sync.
#
# Triggers:
# - automatically on every push to a feature/** branch (GitHub only offers "Run workflow" for
#   workflows that exist on the default branch, so the first run cannot rely on that button);
# - manually (Actions → "Generate lockfile" → Run workflow, or `gh workflow run lockfile.yml
#   --ref <branch>`); tick "Replace" to resolve everything again from scratch.

on:
  push:
    branches: ['feature/**']
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'Replace: resolve both lockfiles again from scratch'
        type: boolean
        default: false

permissions:
  contents: write   # commit package-lock.json to the selected branch
  actions: write    # start the CI workflow afterwards

defaults:
  run:
    shell: bash

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to run on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the development branch, not main."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update lockfiles from registry.npmjs.org
        id: sync
        run: |
          mkdir -p ci-logs
          { echo "node $(node -v) / npm $(npm -v)"; npm config get registry; } | tee ci-logs/lockfile-00-env.log
          if [ "${{ inputs.regenerate }}" == "true" ]; then rm -f package-lock.json functions/package-lock.json; fi
          npm install --package-lock-only --no-audit --no-fund 2>&1 | tee ci-logs/lockfile-01-app.log
          npm install --package-lock-only --prefix functions --no-audit --no-fund 2>&1 | tee ci-logs/lockfile-01b-functions.log
          git add -N package-lock.json functions/package-lock.json
          if git diff --quiet -- package-lock.json functions/package-lock.json; then
            echo "Lockfiles already match package.json; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- package-lock.json functions/package-lock.json | tee ci-logs/lockfile-02-diffstat.log
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify every package resolves from the official registry
        if: steps.sync.outputs.changed == 'true'
        run: |
          { node scripts/check-lockfile-registry.mjs package-lock.json && node scripts/check-lockfile-registry.mjs functions/package-lock.json; } 2>&1 | tee ci-logs/lockfile-03-registry-check.log

      - name: Expo SDK compatibility check
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci --no-audit --no-fund > ci-logs/lockfile-04-npm-ci.log 2>&1
          npx expo install --check 2>&1 | tee ci-logs/lockfile-05-expo-install-check.log

      - name: Upload lockfiles and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lockfile-and-logs
          path: |
            package-lock.json
            functions/package-lock.json
            ci-logs/

      - name: Commit lockfiles
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json functions/package-lock.json
          git commit -m "chore: sync package-lock.json files with package.json (app: Expo SDK 58; functions)" \
                     -m "Generated by the 'Generate lockfile' workflow (run ${GITHUB_RUN_ID}) with npm $(npm -v) from registry.npmjs.org."
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so start them explicitly.
      - name: Start CI and secret scan on the lockfile commit
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run secret-scan.yml --ref "${GITHUB_REF_NAME}"
