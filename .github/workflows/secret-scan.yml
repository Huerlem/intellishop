name: Secret scan

# Scans new commits on every push and pull request.
# A full-history scan can be started manually (workflow_dispatch); it is expected to
# report the historical findings from commit 0e26321 documented in
# docs/SECURITY_REMEDIATION_PLAN.md until those credentials are revoked.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
