name: Secret scan

# Scans the full Git history of every fetched branch with gitleaks (official release binary,
# SHA-256 verified). Historical findings already documented in docs/SECURITY_REMEDIATION_PLAN.md
# are listed by fingerprint in .gitleaksignore; any new finding fails the job.
# Secret values are redacted from logs and from the uploaded report.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o "$checksums" "$base/$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan full history
        run: |
          ./gitleaks git --redact --no-banner --log-opts="--all" --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json .

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
