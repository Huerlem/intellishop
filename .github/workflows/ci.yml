name: CI

# Executable validation for IntelliShop (M1 onwards). Requires a committed package-lock.json and
# always installs with `npm ci`. Steps: lockfile registry check → install → expo install --check →
# expo-doctor → typecheck → lint → tests → static regression checks → iOS bundle export →
# bundle credential scan → npm audit (production dependencies).
# Every step writes its output to ci-logs/ (uploaded as an artifact) and the job summary lists
# each step's outcome. No secrets are used by this workflow.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # bash -eo pipefail: `cmd | tee log` fails when cmd fails

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  APP_ENV: development

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Require package-lock.json
        id: lockfile
        run: |
          mkdir -p ci-logs
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. The 'Generate lockfile' workflow runs on every push to feature/** (or Actions → Generate lockfile → Run workflow); it commits the lockfile and starts CI again."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Record tool versions
        run: |
          { echo "node $(node -v)"; echo "npm $(npm -v)"; echo "python $(python3 --version)"; echo "commit ${GITHUB_SHA}"; } | tee ci-logs/00-versions.log

      - name: Lockfile resolves only from registry.npmjs.org
        id: registry
        run: node scripts/check-lockfile-registry.mjs 2>&1 | tee ci-logs/01-lockfile-registry.log

      - name: Install (npm ci)
        id: install
        run: npm ci --no-audit --no-fund 2>&1 | tee ci-logs/02-npm-ci.log

      - name: Resolved top-level dependency versions
        id: versions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm ls --depth=0 2>&1 | tee ci-logs/03-dependency-versions.log

      - name: Expo SDK compatibility (expo install --check)
        id: expo_check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx expo install --check 2>&1 | tee ci-logs/04-expo-install-check.log

      - name: Expo doctor (reviewed manually; non-blocking)
        id: doctor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npx expo-doctor 2>&1 | tee ci-logs/05-expo-doctor.log

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee ci-logs/06-typecheck.log

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint 2>&1 | tee ci-logs/07-lint.log

      - name: Unit and integration tests
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --verbose 2>&1 | tee ci-logs/08-tests.log

      - name: In-app legal bundle matches docs/legal (generated file is current)
        id: legal
        if: ${{ !cancelled() }}
        run: npm run legal:check-app 2>&1 | tee ci-logs/08b-legal-bundle.log

      - name: Static regression checks (imports, named imports, context contracts, routes)
        id: static
        if: ${{ !cancelled() }}
        run: |
          {
            for s in check_imports check_named_imports check_contracts check_routes; do
              echo "== $s"; python3 -I "scripts/audit/$s.py" .
            done
          } 2>&1 | tee ci-logs/09-static-regression.log

      - name: Export iOS JS bundle
        id: export
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run export:ios 2>&1 | tee ci-logs/10-export-ios.log

      - name: Scan exported bundle for credentials
        id: scan
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: npm run scan:bundle 2>&1 | tee ci-logs/11-bundle-scan.log

      - name: npm audit, production dependencies (full report; non-blocking)
        id: audit_report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm audit --omit=dev 2>&1 | tee ci-logs/12-npm-audit.log

      - name: npm audit gate (fails on high or critical production vulnerabilities)
        id: audit_gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee ci-logs/13-npm-audit-gate.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: ci-logs/

      - name: Summary
        if: always()
        run: |
          {
            echo "## IntelliShop CI — ${GITHUB_SHA::7}"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| package-lock.json present | ${{ steps.lockfile.outcome }} |"
            echo "| Lockfile registry check | ${{ steps.registry.outcome }} |"
            echo "| npm ci | ${{ steps.install.outcome }} |"
            echo "| Dependency versions | ${{ steps.versions.outcome }} |"
            echo "| expo install --check | ${{ steps.expo_check.outcome }} |"
            echo "| expo-doctor (non-blocking, reviewed) | ${{ steps.doctor.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Tests | ${{ steps.test.outcome }} |"
            echo "| In-app legal bundle current | ${{ steps.legal.outcome }} |"
            echo "| Static regression checks | ${{ steps.static.outcome }} |"
            echo "| iOS bundle export | ${{ steps.export.outcome }} |"
            echo "| Bundle credential scan | ${{ steps.scan.outcome }} |"
            echo "| npm audit report (non-blocking) | ${{ steps.audit_report.outcome }} |"
            echo "| npm audit gate (high/critical) | ${{ steps.audit_gate.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  firebase:
    # Security Rules tests against the Firebase emulators, and the Cloud Functions build.
    # Uses a demo project ID (no credentials, nothing deployed).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Require lockfiles
        id: lockfiles
        run: |
          mkdir -p ci-logs
          for f in package-lock.json functions/package-lock.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing. Run the 'Generate lockfile' workflow on this branch."
              exit 1
            fi
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Lockfiles resolve only from registry.npmjs.org
        run: node scripts/check-lockfile-registry.mjs functions/package-lock.json 2>&1 | tee ci-logs/20-functions-lockfile-registry.log

      - name: Install (npm ci, app and functions)
        id: install
        run: |
          npm ci --no-audit --no-fund 2>&1 | tee ci-logs/21-npm-ci.log
          npm ci --prefix functions --no-audit --no-fund 2>&1 | tee ci-logs/22-functions-npm-ci.log

      - name: Build Cloud Functions (TypeScript)
        id: functions_build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix functions run build 2>&1 | tee ci-logs/23-functions-build.log

      - name: Lint Cloud Functions
        id: functions_lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx eslint -c eslint.functions.config.js functions/src 2>&1 | tee ci-logs/23b-functions-lint.log

      - name: Security Rules tests (Firestore + Storage emulators)
        id: rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:rules 2>&1 | tee ci-logs/24-rules-tests.log

      - name: npm audit gate, functions production dependencies
        id: functions_audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --prefix functions --omit=dev --audit-level=high 2>&1 | tee ci-logs/25-functions-audit.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firebase-logs
          path: ci-logs/

      - name: Summary
        if: always()
        run: |
          {
            echo "## Firebase checks — ${GITHUB_SHA::7}"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Lockfiles present | ${{ steps.lockfiles.outcome }} |"
            echo "| npm ci (app + functions) | ${{ steps.install.outcome }} |"
            echo "| Functions build | ${{ steps.functions_build.outcome }} |"
            echo "| Functions lint | ${{ steps.functions_lint.outcome }} |"
            echo "| Security Rules tests | ${{ steps.rules.outcome }} |"
            echo "| Functions npm audit gate | ${{ steps.functions_audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
