<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="silver-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A9A9A9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A5ACD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base Circuit Board -->
  <rect x="40" y="40" width="120" height="120" rx="10" ry="10" fill="url(#silver-gradient)" stroke="#757575" stroke-width="3" />
  
  <!-- Circuit Traces -->
  <line x1="40" y1="70" x2="160" y2="70" stroke="#757575" stroke-width="1.5" />
  <line x1="40" y1="100" x2="160" y2="100" stroke="#757575" stroke-width="1.5" />
  <line x1="40" y1="130" x2="160" y2="130" stroke="#757575" stroke-width="1.5" />
  <line x1="70" y1="40" x2="70" y2="160" stroke="#757575" stroke-width="1.5" />
  <line x1="100" y1="40" x2="100" y2="160" stroke="#757575" stroke-width="1.5" />
  <line x1="130" y1="40" x2="130" y2="160" stroke="#757575" stroke-width="1.5" />
  
  <!-- Connection Points -->
  <circle cx="70" cy="70" r="5" fill="#757575" />
  <circle cx="130" cy="70" r="5" fill="#757575" />
  <circle cx="70" cy="130" r="5" fill="#757575" />
  <circle cx="130" cy="130" r="5" fill="#757575" />
  
  <!-- "404" Text -->
  <text x="100" y="107" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#indigo-gradient)" text-anchor="middle">404</text>
  
  <!-- Broken Circuit Line -->
  <path d="M60,30 L80,30" stroke="url(#indigo-gradient)" stroke-width="4" stroke-linecap="round" />
  <path d="M90,30 L140,30" stroke="url(#indigo-gradient)" stroke-width="4" stroke-linecap="round" />
  
  <path d="M170,60 L170,80" stroke="url(#indigo-gradient)" stroke-width="4" stroke-linecap="round" />
  <path d="M170,90 L170,140" stroke="url(#indigo-gradient)" stroke-width="4" stroke-linecap="round" />
  
  <path d="M60,170 L80,170" stroke="url(#indigo-gradient)" stroke-width="4" stroke-linecap="round" />
  <path d="M90,170 L140,170" stroke="url(#indigo-gradient)" stroke-width="4" stroke-linecap="round" />
  
  <path d="M30,60 L30,80" stroke="url(#indigo-gradient)" stroke-width="4" stroke-linecap="round" />
  <path d="M30,90 L30,140" stroke="url(#indigo-gradient)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Sparks/Lightning Effect -->
  <path d="M85,30 C85,28 86,32 85,30" stroke="url(#gold-gradient)" stroke-width="3" stroke-linecap="round" />
  <path d="M170,85 C172,85 168,86 170,85" stroke="url(#gold-gradient)" stroke-width="3" stroke-linecap="round" />
  <path d="M85,170 C85,172 86,168 85,170" stroke="url(#gold-gradient)" stroke-width="3" stroke-linecap="round" />
  <path d="M30,85 C28,85 32,86 30,85" stroke="url(#gold-gradient)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Warning Symbol -->
  <g transform="translate(100, 140)">
    <path d="M0,-15 L10,5 L-10,5 Z" fill="url(#gold-gradient)" stroke="#757575" stroke-width="1" />
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#757575" text-anchor="middle">!</text>
  </g>
</svg>