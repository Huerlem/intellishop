name: CI

# Executable validation for IntelliShop (milestone M1 onwards):
# install → dependency checks → typecheck → lint → tests → iOS bundle export → bundle secret scan.
# Every step's output is saved to ci-logs/ and uploaded as an artifact; the job summary lists
# each step's outcome. No secrets are needed or used by this workflow.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # gives `-eo pipefail`, so `cmd | tee log` fails when cmd fails

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  APP_ENV: development

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record tool versions
        run: |
          mkdir -p ci-logs
          { echo "node $(node -v)"; echo "npm $(npm -v)"; echo "commit ${GITHUB_SHA}"; } | tee ci-logs/00-versions.log

      # With package-lock.json: reproducible `npm ci`.
      # Without it (first run after the SDK 58 migration): `npm install` generates the lockfile
      # from the official registry and uploads it as an artifact to be committed.
      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            echo "mode=ci" >> "$GITHUB_OUTPUT"
            npm ci --no-audit --no-fund 2>&1 | tee ci-logs/01-install.log
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            echo "::warning::package-lock.json is missing. Generating it (bootstrap run). Download the 'package-lock' artifact and commit it."
            npm install --no-audit --no-fund 2>&1 | tee ci-logs/01-install.log
          fi

      - name: Upload generated lockfile
        if: steps.install.outputs.mode == 'bootstrap' && steps.install.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Resolved top-level dependency versions
        id: versions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm ls --depth=0 2>&1 | tee ci-logs/02-dependency-versions.log

      - name: Expo SDK compatibility (expo install --check)
        id: expo_check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx expo install --check 2>&1 | tee ci-logs/03-expo-install-check.log

      - name: Expo doctor
        id: doctor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npx --yes expo-doctor 2>&1 | tee ci-logs/04-expo-doctor.log

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee ci-logs/05-typecheck.log

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint 2>&1 | tee ci-logs/06-lint.log

      - name: Unit and integration tests
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --verbose 2>&1 | tee ci-logs/07-tests.log

      - name: Export iOS JS bundle
        id: export
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run export:ios 2>&1 | tee ci-logs/08-export-ios.log

      - name: Scan exported bundle for credentials
        id: scan
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: npm run scan:bundle 2>&1 | tee ci-logs/09-bundle-scan.log

      - name: Dependency vulnerability audit (production dependencies)
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm audit --omit=dev 2>&1 | tee ci-logs/10-npm-audit.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/

      - name: Summary
        if: always()
        run: |
          {
            echo "## IntelliShop CI"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Install (${{ steps.install.outputs.mode }}) | ${{ steps.install.outcome }} |"
            echo "| Dependency versions | ${{ steps.versions.outcome }} |"
            echo "| expo install --check | ${{ steps.expo_check.outcome }} |"
            echo "| expo-doctor (non-blocking) | ${{ steps.doctor.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Tests | ${{ steps.test.outcome }} |"
            echo "| iOS bundle export | ${{ steps.export.outcome }} |"
            echo "| Bundle secret scan | ${{ steps.scan.outcome }} |"
            echo "| npm audit (non-blocking) | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
