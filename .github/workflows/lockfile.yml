name: Generate lockfile

# Manually started (Actions → "Generate lockfile" → Run workflow → choose the branch).
# Resolves the dependency graphs of the app (./) and of Cloud Functions (functions/) from the
# official npm registry, commits package-lock.json files to the selected branch, then starts the
# CI workflow on that commit (CI always uses `npm ci`). Refuses to run on `main`.

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'Replace an existing package-lock.json'
        type: boolean
        default: false

permissions:
  contents: write   # commit package-lock.json to the selected branch
  actions: write    # start the CI workflow afterwards

defaults:
  run:
    shell: bash

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to run on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the development branch, not main."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Decide which lockfiles to (re)generate
        id: which
        run: |
          app=false; fn=false
          if [ "${{ inputs.regenerate }}" == "true" ]; then rm -f package-lock.json functions/package-lock.json; fi
          [ -f package-lock.json ] || app=true
          [ -f functions/package-lock.json ] || fn=true
          if [ "$app" == "false" ] && [ "$fn" == "false" ]; then
            echo "::error::Both lockfiles already exist. Re-run with 'Replace an existing package-lock.json' ticked to regenerate them."
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "functions=$fn" >> "$GITHUB_OUTPUT"

      - name: Resolve and install from registry.npmjs.org (app)
        if: steps.which.outputs.app == 'true'
        run: |
          mkdir -p ci-logs
          { echo "node $(node -v) / npm $(npm -v)"; npm config get registry; } | tee ci-logs/lockfile-00-env.log
          npm install --no-audit --no-fund 2>&1 | tee ci-logs/lockfile-01-npm-install.log

      - name: Resolve and install from registry.npmjs.org (functions)
        if: steps.which.outputs.functions == 'true'
        run: |
          mkdir -p ci-logs
          npm install --prefix functions --no-audit --no-fund 2>&1 | tee ci-logs/lockfile-01b-functions-npm-install.log

      - name: Verify every package resolves from the official registry
        run: |
          mkdir -p ci-logs
          { node scripts/check-lockfile-registry.mjs package-lock.json && node scripts/check-lockfile-registry.mjs functions/package-lock.json; } 2>&1 | tee ci-logs/lockfile-02-registry-check.log

      - name: Expo SDK compatibility check
        run: |
          [ -d node_modules ] || npm ci --no-audit --no-fund > /dev/null
          npx expo install --check 2>&1 | tee ci-logs/lockfile-03-expo-install-check.log

      - name: Upload lockfile and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lockfile-and-logs
          path: |
            package-lock.json
            functions/package-lock.json
            ci-logs/

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json functions/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles unchanged; nothing to commit."
          else
            git commit -m "chore: add package-lock.json files (app: Expo SDK 58; functions)" \
                       -m "Generated by the 'Generate lockfile' workflow (run ${GITHUB_RUN_ID}) with npm $(npm -v) from registry.npmjs.org."
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so start them explicitly.
      - name: Start CI and secret scan on the lockfile commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run secret-scan.yml --ref "${GITHUB_REF_NAME}"
